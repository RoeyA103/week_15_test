apiVersion: apps/v1
kind: Deployment
metadata:
  name: api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: application
    spec:
      containers:
      - name: api
        image: roeyaverbuch/api-mongo:v0.3
        ports:
        - containerPort: 8000
        env:
          - name: MONGO_URI
            value: "mongodb://mongo-0.mongo-svc:27017/"
            
